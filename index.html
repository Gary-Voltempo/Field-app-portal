<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voltempo Portal</title>
    <link rel="stylesheet" href="./styles.css?v=15" />
    <script src="./app.js?v=15" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Voltempo">
          <img src="./assets/voltempo_logo.svg" alt="Voltempo" class="brand-logo" />
        </div>

        <div class="topbar-public-actions">
          <button id="submitReportButton" class="button success" type="button" disabled>
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </span>
            <span class="button-label">Submit Report</span>
          </button>
          <button id="signInButton" class="button primary" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <path d="M10 17l5-5-5-5M15 12H3" />
              </svg>
            </span>
            <span class="button-label">Sign In</span>
          </button>
        </div>

        <button
          id="menuToggle"
          class="hamburger"
          type="button"
          aria-label="Open menu"
          aria-controls="topbarMenu"
          aria-expanded="false"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </span>
        </button>

        <div id="topbarMenu" class="topbar-actions" aria-label="Application menu">
          <span id="cloudState" class="state-chip">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M17.5 19H8a5 5 0 1 1 1.1-9.9 6 6 0 0 1 11.1 3.2A3.7 3.7 0 0 1 17.5 19Z" />
              </svg>
            </span>
            <span class="state-label">Offline</span>
          </span>

          <button id="syncButton" class="button" type="button" disabled>
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16" />
                <path d="M3 16v5h5M3 12A9 9 0 0 1 18.5 5.8L21 8" />
                <path d="M21 8V3h-5" />
              </svg>
            </span>
            <span class="button-label">Sync</span>
          </button>
          <button id="importButton" class="button" type="button">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
                <path d="M14 2v6h6M12 12v6M9 15l3 3 3-3" />
              </svg>
            </span>
            <span class="button-label">Import JSON</span>
          </button>
          <button id="uploadButton" class="button success" type="button" disabled>
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M17.5 19H8a5 5 0 1 1 1.1-9.9 6 6 0 0 1 11.1 3.2A3.7 3.7 0 0 1 17.5 19Z" />
                <path d="M12 16V9M9 12l3-3 3 3" />
              </svg>
            </span>
            <span class="button-label">Upload</span>
          </button>
          <button id="saveButton" class="button success" type="button" disabled>
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
                <path d="M7 3v6h9M7 21v-8h10v8" />
              </svg>
            </span>
            <span class="button-label">Save</span>
          </button>
          <button id="exportButton" class="button" type="button" disabled>
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
                <path d="M14 2v6h6M8 16h8M8 12h2" />
              </svg>
            </span>
            <span class="button-label">Export PDF</span>
          </button>
          <button id="signOutButton" class="button subtle" type="button" hidden>
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <path d="M16 17l5-5-5-5M21 12H9" />
              </svg>
            </span>
            <span class="button-label">Sign Out</span>
          </button>

          <input id="fileInput" type="file" accept=".json,application/json" hidden />
          <input id="attachmentFileInput" type="file" accept="image/*,.pdf,application/pdf" hidden />
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <div class="sidebar-tools">
            <label class="search-label" for="searchInput">Search</label>
            <input
              id="searchInput"
              type="search"
              placeholder="Site, ID, title, notes"
              autocomplete="off"
            />
            <div class="count-row">
              <span id="reportCount">0 reports</span>
              <span id="dirtyState"></span>
            </div>
          </div>
          <div id="reportList" class="report-list"></div>
        </aside>

        <section class="editor-pane">
          <div id="emptyState" class="empty-state">
            <h2>Sign in to load reports</h2>
          </div>
          <form id="reportEditor" class="report-editor" hidden></form>
        </section>
      </main>

      <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      </div>

      <div id="assetViewer" class="asset-viewer" hidden>
        <div class="asset-viewer-backdrop" data-action="viewer-close"></div>
        <section class="asset-viewer-panel" role="dialog" aria-modal="true" aria-label="Attachment viewer">
          <header class="asset-viewer-header">
            <div>
              <strong id="assetViewerTitle">Attachment</strong>
              <span id="assetViewerMeta"></span>
            </div>
            <button class="icon-button" type="button" data-action="viewer-close" aria-label="Close viewer">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M18 6 6 18M6 6l12 12" />
                </svg>
              </span>
            </button>
          </header>
          <div class="asset-viewer-body">
            <button class="icon-button viewer-nav prev" type="button" data-action="viewer-prev" aria-label="Previous attachment">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="m15 18-6-6 6-6" />
                </svg>
              </span>
            </button>
            <div id="assetViewerStage" class="asset-viewer-stage"></div>
            <button class="icon-button viewer-nav next" type="button" data-action="viewer-next" aria-label="Next attachment">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="m9 18 6-6-6-6" />
                </svg>
              </span>
            </button>
          </div>
          <footer class="asset-viewer-actions">
            <a id="assetViewerDownload" class="small-button" href="#" target="_blank" rel="noopener" download>Download</a>
          </footer>
        </section>
      </div>
    </div>
  </body>
</html>
